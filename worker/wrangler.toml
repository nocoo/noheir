name = "noheir"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Manual `bun run dev` port (per personal port plan: dev+30000 = 37004).
# E2E runner uses 17004 via `--port`, so this is only for ad-hoc poking.
[dev]
port = 37004

[vars]
# WORKER_TOKEN is set via `wrangler secret put WORKER_TOKEN`

[[d1_databases]]
binding = "DB"
database_name = "noheir-db"
database_id = "586c101d-df19-4e1f-a946-42151c1e199d"
migrations_dir = "db/migrations"

# Custom domain for the Worker
[[routes]]
pattern = "noheir.worker.hexly.ai/*"
zone_name = "hexly.ai"
