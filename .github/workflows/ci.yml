name: CI
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
jobs:
  l1-hook-verify:
    name: "L1: Husky gate probes"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: bun
          runtime-version: 1.4.2
          node-version: 26.12.1
          install-policy: trusted
          extra-install-dirs: worker

      - name: Install Husky launchers
        run: bun run prepare

      - name: Verify L1 Husky rejection matrix
        run: bun run test:l1-gate

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: 1.4.2
      node-version: 26.12.1
      install-policy: trusted
      coverage-path: coverage
      extra-install-dirs: worker
      prepare-command: bun run build
      test-command: bun run test:coverage
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      lockfiles: bun.lock,worker/bun.lock
      l2-command: bun run test:e2e
      l3-command: bun run test:e2e:bdd
      l3-browser: chromium
      worker: true
      worker-directory: .
      worker-command: bun run --cwd worker test:coverage
      l2: true
      l3: true
  release-smoke:
    name: Release Workflow Smoke
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      yamllint: true
permissions:
  contents: read
