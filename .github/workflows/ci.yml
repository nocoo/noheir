name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: 1.4.2
      install-policy: trusted
      coverage-path: coverage
      extra-install-dirs: worker
      prepare-command: bun run build
      test-command: bun run test:coverage
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      l2-command: bun run test:e2e
      l3-command: bun run test:e2e:bdd
      l3-browser: chromium
      worker: true
      l2: true
      l3: true
  release-smoke:
    name: Release Workflow Smoke
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-docker.yml
      yamllint: true
permissions:
  contents: read
