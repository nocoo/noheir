# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1–G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2/L3 artifacts.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  l1-hook-verify:
    name: "L1: Husky gate probes"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: bun
          runtime-version: 1.4.2
          node-version: 26.12.1
          install-policy: trusted
          extra-install-dirs: worker

      - name: Install Husky launchers
        run: bun run prepare

      - name: Verify L1 Husky rejection matrix
        run: bun run test:l1-gate

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: 1.4.2
      node-version: 26.12.1
      install-policy: trusted
      coverage-path: coverage
      extra-install-dirs: worker
      prepare-command: bun run build
      test-command: bun run test:coverage && bun run --cwd worker test:coverage
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      lockfiles: bun.lock,worker/bun.lock
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:e2e
      l3: true
      l3-browsers: chromium
      l3-prepare-command: bun run build
      l3-command: bun run test:e2e:bdd
      l3-artifact-name: browser-e2e-evidence
      l3-artifact-path: |
        playwright-report/
        test-results/
      l3-artifact-retention-days: 14
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "Worker 单元测试为 better-sqlite3 Vitest，未使用 vitest-pool-workers / miniflare 运行时套件"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
