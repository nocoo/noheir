name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026.4
    with:
      ignore-scripts: true
      extra-install-dirs: "worker"
      pre-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run typecheck"
      osv-config: "osv-scanner.toml"
      enable-l2: "true"
      l2-command: "bun run test:e2e"
      enable-l3: "true"
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
    secrets: inherit
